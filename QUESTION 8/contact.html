<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Hub - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Contact Us</h1>
    <p>We would love to hear from you</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html">Contact</a>
</nav>

<main>
    <section class="content">
        <h2>Get In Touch</h2>

        <p>
            Fill in the form below to send us your message.
        </p>

        <form action="#" method="post">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject"
                   placeholder="Enter subject" required>

            <p>Preferred Contact Method:</p>

            <label class="choice">
                <input type="radio" name="contact_method"
                       value="Email" required> Email
            </label>

            <label class="choice">
                <input type="radio" name="contact_method"
                       value="Phone"> Phone
            </label>

            <p>Other Preferences:</p>

            <label class="choice">
                <input type="checkbox" name="newsletter">
                Subscribe to Newsletter
            </label>

            <label class="choice">
                <input type="checkbox" name="updates">
                Receive Updates
            </label>

            <label for="reason">Reason for Contact:</label>

            <select id="reason" name="reason" required>
                <option value="">Select a reason</option>
                <option value="Feedback">Feedback</option>
                <option value="Support">Support</option>
                <option value="Collaboration">Collaboration</option>
            </select>

            <label for="message">Your Message:</label>

            <textarea id="message" name="message"
                      rows="5" placeholder="Write your message here"
                      required></textarea>

            <button type="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>

        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Creative Hub. All Rights Reserved.</p>
    <p>Follow us: Facebook | Instagram | YouTube</p>
</footer>

</body>
</html>
